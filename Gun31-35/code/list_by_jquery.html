<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dinamik Liste</title>
    <style>
    	* {
			margin: 0;
			padding: 0;
		}
		body {
			background-color: #000;
			color: #fff;
		}
		#app {
			width: 40%;
			margin: 20px auto;
		}
		#fruits>li {
			width: 90%;
			height: 50px;
			background-color: #6ca;
			margin: 4px 0;
			text-align: center;
			font-size: 20px;
			list-style-type: none;
			line-height: 50px;
		}
		#fruits>li>a {
			float: right;
			color: #fff;
			text-decoration: none;
			margin-right: 10px;
		}
		#fruits+div {
			margin-top: 20px;
		}
		#fname {
			width: 70%;
			height: 40px;
			color: #fff;
			border-radius: 8px;
			border: none;
			outline: none;
			font-size: 20px;
			text-align: center;
			vertical-align: middle;
			background-color: #999;
		}
		#ok {
			width: 19%;
			height: 40px;
			color: #fff;
			background-color: #a45;
			border: none;
			outline: none;
			font-size: 16px;
			vertical-align: middle;
		}
    </style>
</head>
<body>
    <div id="app">
        <ul id="fruits">
            <li>Elma<a href="">×</a></li>
            <li>Muz<a href="">×</a></li>
            <li>Durian<a href="">×</a></li>
            <li>Pitaya<a href="">×</a></li>
        </ul>
        <div>
            <input type="text" id="fname">
            <button id="ok">Ekle</button>
        </div>
    </div>
    <script src="https://cdn.bootcss.com/jquery/3.4.1/jquery.min.js"></script>
    <script>
    // 1. $ fonksiyonunun parametresi bir fonksiyondur; bu fonksiyon, sayfa yüklendikten sonra çalışan geri çağrı fonksiyonudur
    $(() => {
        function removeItem(evt) {
            evt.preventDefault()
            // 4. $ fonksiyonunun parametresi ham JavaScript nesnesidir; bu ham JavaScript nesnesine karşılık gelen jQuery nesnesini döndürür
            $(evt.target).parent().remove()
        }

        function addItem(evt) {
            let fname = $('#fname').val().trim()
            if (fname.length > 0) {
                $('#fruits').append(
                    // 3. $ fonksiyonunun parametresi etiket string'idir; ilgili etiket elemanını oluşturur ve jQuery nesnesi döndürür
                    $('<li>').text(fname).append(
                        $('<a>').attr('href', '').text('×')
                        	.on('click', removeItem)
                    )
                )
            }
            $('#fname').val('')
            // jQuery nesnesi, indis işlemi veya get yöntemiyle kendisine karşılık gelen ham JavaScript nesnesini elde edebilir
            // input.get(0).focus()
            $('#fname')[0].focus()
        }

        // 2. $ fonksiyonunun parametresi seçici string'idir; ilgili elemanların jQuery nesnesini döndürür
        $('#fruits a').on('click', removeItem)
        $('#ok').on('click', addItem)
        $('#fname').on('keydown', (evt) => {
        	let code = evt.keyCode || evt.which
        	if (code == 13) {
        		addItem(evt)
        	}
        })
    })
    </script>
</body>
</html>
